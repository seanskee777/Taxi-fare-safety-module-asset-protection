<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Fare Safety Module</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
        }
        .form-section {
            background-color: #fff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, select, textarea {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Taxi Fare Safety Module</h1>

    <!-- Dispatcher Form -->
    <div class="form-section">
        <h2>Pre-Pickup Questionnaire</h2>
        <label>Passenger Full Name:
            <input type="text" placeholder="First Last">
        </label>
        <label>Phone Number:
            <input type="tel" placeholder="(XXX) XXX-XXXX">
        </label>
        <label>Pick-Up Address:
            <input type="text" placeholder="Street, City">
        </label>
        <label>Drop-Off Address:
            <input type="text" placeholder="Street, City">
        </label>
        <label>Payment Method:
            <select>
                <option value="cash">Cash</option>
                <option value="card">Credit/Debit Card</option>
            </select>
        </label>
        <label>Intoxicated / Medical Flag:
            <select>
                <option value="none">None</option>
                <option value="alcohol">Alcohol</option>
                <option value="medical">Medical</option>
            </select>
        </label>
        <label>Notes / Special Instructions:
            <textarea placeholder="Additional info or flags"></textarea>
        </label>
    </div>

    <!-- Post-Acceptance Info -->
    <div class="form-section">
        <h2>After Acceptance</h2>
        <label>Driver Notes:</label>
        <textarea placeholder="Record any unusual behavior, MO, or red flags"></textarea>
        <label>Completion Confirmation:</label>
        <select>
            <option value="completed">Trip Completed</option>
            <option value="failed">Trip Failed / No Payment</option>
        </select>
    </div>

    <footer>
        <p>© Taxi Fare Safety Module | Go Team Go!</p>
    </footer>
</body>
</html>
